<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hast du gut geschlafen? ☀️</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#eef7ff,#fff8ed);color:#34445a;overflow:hidden}
.card{width:min(92vw,540px);padding:38px 28px;text-align:center;background:rgba(255,255,255,.92);border-radius:28px;box-shadow:0 18px 55px rgba(61,83,110,.14)}
.icon{font-size:52px;animation:bob 2.4s ease-in-out infinite}
h1{margin:12px 0 8px;font-size:clamp(27px,7vw,39px)}
p{font-size:18px;line-height:1.5;margin:0 0 24px}
.buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
button{border:0;border-radius:999px;padding:13px 21px;font-size:16px;font-weight:700;cursor:pointer;color:#fff;box-shadow:0 8px 18px rgba(80,110,145,.18);transition:.18s}
button:hover{transform:translateY(-2px) scale(1.03)}
.yes{background:#78b894}.okay{background:#e0a35b}.no{background:#8da7c7}
.answer{display:none;margin-top:22px;padding:18px;border-radius:18px;background:#f4f8fc;font-size:19px;line-height:1.5}
.small{font-size:14px;opacity:.65;margin-top:18px}
.float{position:fixed;pointer-events:none;animation:rise 3s ease-out forwards}
@keyframes bob{50%{transform:translateY(-7px)}}
@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-100vh) rotate(15deg);opacity:0}}
</style>
</head>
<body>
<main class="card">
  <div class="icon">☀️😴</div>
  <h1>Guten Morgen! 👋</h1>
  <p>Kurze Frage zum Start in den Tag:<br><strong>Hast du gut geschlafen? 😊</strong></p>

  <div class="buttons">
    <button class="yes" onclick="answer('yes')">Ja! 😄</button>
    <button class="okay" onclick="answer('okay')">Joa, ganz okay 😌</button>
    <button class="no" onclick="answer('no')">Nee 😴</button>
  </div>

  <div id="answer" class="answer"></div>
  <div class="small">Keine Sorge, die Antwort wird nicht bewertet. 😄</div>
</main>

<script>
const texts = {
  yes: [
    "Yay! 😄 Dann kann der Tag ja gut starten. ☀️",
    "Sehr gut! 😌 Freut mich für dich. Hab einen schönen Tag! 🌻",
    "Na dann: ausgeschlafen und bereit für den Tag! 😎"
  ],
  okay: [
    "Immerhin! 😄 Hoffentlich wird der Tag dafür umso besser.",
    "Ganz okay zählt! 😌 Vielleicht brauchst du heute einfach ein bisschen extra Kaffee. ☕",
    "Dann wünsche ich dir, dass du heute trotzdem richtig gut in den Tag kommst! 🌤️"
  ],
  no: [
    "Oh no 😭 Dann hoffe ich, dass du heute wenigstens einen entspannten Tag hast! 🌻",
    "Auweia 😴 Dann wünsche ich dir ganz viel Energie für heute! 💪",
    "Das klingt nach einer Nacht, die man lieber vergessen möchte. 😄 Hoffentlich wird dein Tag besser!"
  ]
};

function answer(type){
  const list = texts[type];
  document.getElementById("answer").textContent = list[Math.floor(Math.random()*list.length)];
  document.getElementById("answer").style.display = "block";
  const symbols = type === "yes" ? ["☀️","✨","😄"] : type === "okay" ? ["☕","🌤️","✨"] : ["😴","🌻","💤"];
  for(let i=0;i<12;i++){
    const el=document.createElement("div");
    el.className="float";
    el.textContent=symbols[Math.floor(Math.random()*symbols.length)];
    el.style.left=Math.random()*100+"vw";
    el.style.top=(75+Math.random()*20)+"vh";
    el.style.fontSize=(15+Math.random()*18)+"px";
    el.style.animationDelay=(Math.random()*.5)+"s";
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),3500);
  }
}
</script>
</body>
</html>
